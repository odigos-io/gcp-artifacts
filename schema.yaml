x-google-marketplace:
  schemaVersion: v2

  applicationApiVersion: v1beta1
  # The published version is required and MUST match the tag
  # of the deployer image
  publishedVersion: '1.23.0'
  publishedVersionMetadata:
    releaseNote: >-
      Odigos is a platform for tracing and observability.

  images:
    '':
      properties:
        imageFull:
          type: FULL
    odigos-agents:
      properties:
        initContainerImageFull:
          type: FULL
    odigos-enterprise-agents:
      properties:
        enterpriseInitContainerImageFull:
          type: FULL
    odigos-scheduler:
      properties:
        schedulerImageFull:
          type: FULL
    odigos-instrumentor:
      properties:
        instrumentorImageFull:
          type: FULL
    odigos-odiglet:
      properties:
        odigletImageFull:
          type: FULL
    odigos-ui:
      properties:
        uiImageFull:
          type: FULL
    odigos-autoscaler:
      properties:
        autoscalerImageFull:
          type: FULL
    odigos-collector:
      properties:
        collectorImageFull:
          type: FULL
    odigos-enterprise-odiglet:
      properties:
        enterpriseOdigletImageFull:
          type: FULL
    odigos-enterprise-instrumentor:
      properties:
        enterpriseInstrumentorImageFull:
          type: FULL

properties:
  name:
    type: string
    x-google-marketplace:
      type: NAME
  namespace:
    type: string
    x-google-marketplace:
      type: NAMESPACE
  onPremToken:
    type: string
  reportingSecret:
    type: string
    x-google-marketplace:
      type: REPORTING_SECRET

  installerServiceAccount:
    type: string
    x-google-marketplace:
      type: SERVICE_ACCOUNT
      serviceAccount:
        description: >
            Creates app resources, including the Odigos CRDs and RBAC resources.
        roles:
          - type: ClusterRole
            rulesType: CUSTOM
            rules:
            # CRD management
            - apiGroups: ['apiextensions.k8s.io']
              resources: ['customresourcedefinitions']
              verbs: ['*']
            # Odigos CRDs
            - apiGroups: ['odigos.io']
              resources: ['*']
              verbs: ['*']
            - apiGroups: ['actions.odigos.io']
              resources: ['*']
              verbs: ['*']
            - apiGroups: ['operator.odigos.io']
              resources: ['*']
              verbs: ['*']
            # Application CR (installer adds/removes uninstall finalizer; informer + SIGTERM; Deployment→Application owner ref)
            - apiGroups: ['app.k8s.io']
              resources: ['applications']
              verbs: ['get', 'list', 'watch', 'patch', 'update']
            # Core resources
            - apiGroups: ['']
              resources: ['configmaps', 'secrets', 'services', 'serviceaccounts', 'pods', 'namespaces', 'resourcequotas', 'nodes', 'endpoints', 'events']
              verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete', 'deletecollection']
            # Core finalizers (operator kubebuilder)
            - apiGroups: ['']
              resources: ['configmaps/finalizers', 'pods/finalizers']
              verbs: ['update']
            # Core subresources
            - apiGroups: ['']
              resources: ['nodes/proxy', 'pods/status']
              verbs: ['get', 'list']
            - apiGroups: ['']
              resources: ['nodes/stats']
              verbs: ['get', 'list', 'watch']
            # pods/log + pods/proxy: required so Helm can bind odigos-ui Role (UI debug dump / pprof)
            - apiGroups: ['']
              resources: ['pods/log', 'pods/proxy']
              verbs: ['get']
            # Apps resources
            - apiGroups: ['apps']
              resources: ['deployments', 'daemonsets', 'statefulsets', 'replicasets']
              verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete', 'deletecollection']
            # Apps subresources
            - apiGroups: ['apps']
              resources: ['deployments/status', 'daemonsets/status', 'statefulsets/status']
              verbs: ['get']
            - apiGroups: ['apps']
              resources: ['deployments/scale']
              verbs: ['get', 'update', 'patch']
            # Apps finalizers (operator kubebuilder)
            - apiGroups: ['apps']
              resources: ['deployments/finalizers', 'replicasets/finalizers', 'daemonsets/finalizers', 'statefulsets/finalizers']
              verbs: ['update']
            # Batch resources
            - apiGroups: ['batch']
              resources: ['jobs', 'cronjobs']
              verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
            # Autoscaling resources
            - apiGroups: ['autoscaling']
              resources: ['horizontalpodautoscalers']
              verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
            # Coordination resources (for leader election)
            - apiGroups: ['coordination.k8s.io']
              resources: ['leases']
              verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
            # RBAC resources
            - apiGroups: ['rbac.authorization.k8s.io']
              resources: ['roles', 'rolebindings', 'clusterroles', 'clusterrolebindings']
              verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete', 'deletecollection']
            # Policy resources
            - apiGroups: ['policy']
              resources: ['poddisruptionbudgets']
              verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
            # PodSecurityPolicy (operator kubebuilder: use named privileged PSP)
            - apiGroups: ['policy']
              resources: ['podsecuritypolicies']
              resourceNames: ['privileged']
              verbs: ['use']
            # Admission webhooks (Odigos instrumentor/autoscaler) + mpdev verify cleanup / discovery.
            # Broad rule avoids Forbidden on list (e.g. mutatingwebhookconfigurations) on newer clusters.
            - apiGroups: ['admissionregistration.k8s.io']
              resources: ['*']
              verbs: ['*']
            # Aggregated APIServices (e.g. custom.metrics from Odigos chart): delete when release ns is terminating
            # so namespace deletion is not blocked by NamespaceDeletionDiscoveryFailure.
            - apiGroups: ['apiregistration.k8s.io']
              resources: ['apiservices']
              verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
            # OpenShift SCC (operator kubebuilder)
            - apiGroups: ['security.openshift.io']
              resources: ['securitycontextconstraints']
              verbs: ['use']
            # OpenShift DeploymentConfigs (operator kubebuilder)
            - apiGroups: ['apps.openshift.io']
              resources: ['deploymentconfigs', 'deploymentconfigs/finalizers']
              verbs: ['get', 'list', 'watch', 'update', 'patch']
            # Argo Rollouts (operator kubebuilder)
            - apiGroups: ['argoproj.io']
              resources: ['rollouts']
              verbs: ['get', 'list', 'watch', 'update', 'patch']
            # EndpointSlices (operator kubebuilder)
            - apiGroups: ['discovery.k8s.io']
              resources: ['endpointslices']
              verbs: ['get', 'list', 'watch']

required:
- name
- namespace
- reportingSecret
